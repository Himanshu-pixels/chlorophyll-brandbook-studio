<style>/* ============ chlorophyll brandbook studio — admin interface ============ */
:root{
  --forest:#1E3510; --forest-2:#2A4719; --green:#376337; --leaf:#489F52; --leaf-soft:#E5F0E2; --leaf-tint:#F1F6EE;
  --maroon:#7E2526; --maroon-soft:#F6E9E8; --ivory:#FCFAF5; --paper:#FFFFFF; --ink:#1B2316; --text:#3B4237; --muted:#7D827A; --grey:#909294;
  --line:#E7E4DB; --line-2:#D9D5CA; --hover:#F5F2EA; --focus:0 0 0 3px rgba(72,159,82,.35);
  --r:6px; --r-lg:10px; --sh:0 1px 2px rgba(30,53,16,.06),0 4px 16px rgba(30,53,16,.05); --sh-lg:0 12px 40px rgba(30,53,16,.16);
  --ui:'Instrument Sans',system-ui,-apple-system,sans-serif; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
}
*{box-sizing:border-box} html,body{margin:0;height:100%} body{font-family:var(--ui);color:var(--text);background:var(--ivory);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.is-site{background:#fff}
button,input,select,textarea{font:inherit;color:inherit} button{cursor:pointer} a{color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:4px}
.ic{flex-shrink:0;vertical-align:middle}
h1,h2,h3{color:var(--ink);margin:0;font-weight:600;letter-spacing:-.01em}
.muted{color:var(--muted)} .sm{font-size:12.5px} .lead{font-size:15.5px;margin:0 0 var(--s5)} .mono{font-family:ui-monospace,SFMono-Regular,monospace}
kbd{font:11px var(--ui);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#fff;color:var(--muted)}
code{font-size:12px;background:var(--hover);padding:1px 4px;border-radius:3px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:#fff;color:var(--ink);font-weight:500;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--hover);border-color:var(--grey)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--forest);border-color:var(--forest);color:#fff} .btn.primary:hover{background:var(--forest-2)}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:var(--hover)}
.btn.danger{background:var(--maroon);border-color:var(--maroon);color:#fff} .btn.danger:hover{background:#6a1d1e}
.btn.danger-ghost{color:var(--maroon);border-color:#E3C9C8} .btn.danger-ghost:hover{background:var(--maroon-soft)}
.btn.sm{height:30px;padding:0 10px;font-size:13px} .btn.lg{height:44px;padding:0 20px;font-size:15px} .btn.full{width:100%;margin-bottom:8px}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid transparent;border-radius:var(--r);background:transparent;color:var(--text)} .icon-btn:hover{background:var(--hover)} .icon-btn.on{background:var(--leaf-soft);color:var(--forest)} .icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn.sm{width:28px;height:28px} .icon-btn.xs{width:24px;height:24px}
.link{border:0;background:none;color:var(--green);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);background:#fff;padding:2px;gap:2px} .seg button{border:0;background:none;height:28px;padding:0 10px;border-radius:4px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-weight:500} .seg button.on{background:var(--leaf-soft);color:var(--forest)} .seg .icon-btn{width:30px;height:28px;border:0}
.seg.full{display:flex;width:100%} .seg.full button{flex:1;justify-content:center}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--muted);text-transform:capitalize;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.badge.b-live{background:var(--leaf-soft);color:var(--green)} .badge.b-changes{background:#FBF1DE;color:#8A5A12} .badge.b-draft{background:var(--hover);color:var(--muted)} .badge.b-setup{background:var(--maroon-soft);color:var(--maroon)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;opacity:.8} .spin.lg{width:32px;height:32px;border-width:3px;color:var(--leaf)} @keyframes sp{to{transform:rotate(360deg)}}
.loading-screen{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:24px} .loading-screen h1{font-size:28px}
.site-load{background:#fff}

/* forms */
.inp{width:100%;height:38px;border:1px solid var(--line-2);border-radius:var(--r);background:#fff;padding:0 11px;transition:border-color .15s,box-shadow .15s} textarea.inp{height:auto;padding:9px 11px;resize:vertical} .inp:focus{outline:none;border-color:var(--leaf);box-shadow:var(--focus)} .inp.err,.has-err .inp{border-color:var(--maroon)} input[type=color].inp{padding:3px;height:38px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px} .fld>span{font-size:12.5px;font-weight:600;color:var(--ink)} .fld em{color:var(--maroon);font-style:normal} .err-t{color:var(--maroon);font-size:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;max-width:760px} .form .full{grid-column:1/-1}
.tog{display:flex;align-items:center;gap:9px;margin:4px 0 12px;cursor:pointer;font-weight:500} .tog input{width:34px;height:20px;appearance:none;background:var(--line-2);border-radius:999px;position:relative;cursor:pointer;transition:background .15s;flex-shrink:0} .tog input::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)} .tog input:checked{background:var(--leaf)} .tog input:checked::after{transform:translateX(14px)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px} .row-l{display:flex;gap:10px;flex-wrap:wrap;align-items:center} .row-c{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
input[type=range]{width:100%;accent-color:var(--leaf)}
.inp-pre{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r);background:#fff;overflow:hidden} .inp-pre span{padding:0 4px 0 11px;color:var(--muted);font-family:ui-monospace,monospace} .inp-pre .inp{border:0;box-shadow:none;padding-left:0}
.copyrow{display:flex;gap:8px;margin:12px 0} .copyrow .inp{font-family:ui-monospace,monospace;font-size:12.5px}

/* toasts / modals / menus */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:1000;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13.5px;box-shadow:var(--sh-lg);animation:tin .2s ease;max-width:90vw} .toast-err{background:var(--maroon)} .toast.out{opacity:0;transform:translateY(6px);transition:all .3s} @keyframes tin{from{opacity:0;transform:translateY(8px)}}
.modal-wrap{position:fixed;inset:0;background:rgba(27,35,22,.42);display:grid;place-items:center;z-index:900;padding:20px;animation:fade .15s} @keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:var(--r-lg);width:min(480px,100%);box-shadow:var(--sh-lg);max-height:calc(100vh - 40px);display:flex;flex-direction:column} .modal.wide{width:min(760px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px} .modal-h h2{font-size:18px} .modal-b{padding:6px 20px 16px;overflow:auto} .modal-b p{margin:0 0 12px} .modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.pop-menu{position:fixed;z-index:950;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-lg);padding:5px;width:200px} .pop-menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:5px;text-align:left;font-size:13.5px} .pop-menu button:hover:not(:disabled),.pop-menu button:focus-visible{background:var(--hover);box-shadow:none} .pop-menu button:disabled{opacity:.6;cursor:default} .pop-menu .danger{color:var(--maroon)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px} .pick{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff;font-weight:500;font-size:13px;text-align:center} .pick:hover{border-color:var(--leaf);background:var(--leaf-tint);color:var(--forest)}
.pick-list{display:flex;flex-direction:column;gap:4px} .pick-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:10px} .pick-row small{margin-left:auto;color:var(--muted)} .pick-row:hover{background:var(--hover)}
.pub-ok{width:56px;height:56px;border-radius:50%;background:var(--leaf-soft);color:var(--green);display:grid;place-items:center;margin:4px 0 14px}
.seed-ov{position:fixed;inset:0;background:rgba(252,250,245,.94);z-index:990;display:grid;place-items:center;text-align:center} .seed-ov h2{margin:16px 0 4px;font-size:20px}

/* app header + dashboard */
.app-top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:20px;height:64px;padding:0 28px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.app-logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:16px;color:var(--ink);letter-spacing:-.01em} .app-logo em{font-style:normal;color:var(--green)} .app-mark{width:30px;height:30px;border-radius:7px;background:var(--forest);color:#fff;display:grid;place-items:center}
.app-search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--ivory);color:var(--muted)} .app-search:focus-within{border-color:var(--leaf);box-shadow:var(--focus);background:#fff} .app-search input{border:0;background:none;flex:1;outline:none;color:var(--ink);height:100%}
.app-right{margin-left:auto;display:flex;align-items:center;gap:12px} .avatar{width:36px;height:36px;border-radius:50%;border:0;background:var(--leaf-soft);color:var(--forest);font-weight:700;font-size:13px}
.dash-main{max-width:1280px;margin:0 auto;padding:44px 28px 80px}
.dash-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap} .dash-hero h1{font-size:34px;letter-spacing:-.025em;color:var(--forest)} .dash-hero p{margin:6px 0 0;color:var(--muted);font-size:15.5px}
.mode-note{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:var(--r)}
.dash-bar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap} .sel-sm{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)} .sel-sm select{height:32px;border:1px solid var(--line-2);border-radius:var(--r);background:#fff;padding:0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;transition:box-shadow .2s,border-color .2s;display:flex;flex-direction:column} .card:hover{box-shadow:var(--sh);border-color:var(--line-2)}
.card-cover{aspect-ratio:16/9;display:grid;place-items:center;padding:28px;text-decoration:none} .card-cover img{max-width:72%;max-height:70%;object-fit:contain} .card-wm{font-size:28px;font-weight:600;letter-spacing:-.01em;text-align:center}
.card-strip{display:flex;height:6px} .card-strip i{flex:1}
.card-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:2px;flex:1} .card-t{display:flex;justify-content:space-between;align-items:center} .card-t h2{font-size:16px} .card-b p{margin:0 0 12px}
.card-f{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px} .card-acts{display:flex;gap:6px}
.card-new{border-style:dashed;align-items:center;justify-content:center;gap:10px;min-height:290px;color:var(--green);text-decoration:none;font-weight:600;background:transparent} .card-new:hover{background:var(--leaf-tint)}
.grid-skel{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px} .skel{height:300px;border-radius:var(--r-lg);background:linear-gradient(90deg,#f3f0e8,#faf8f3,#f3f0e8);background-size:200% 100%;animation:sk 1.4s infinite} @keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:60px 20px;border:1px dashed var(--line-2);border-radius:var(--r-lg);background:#fff} .empty h2{font-size:20px;margin-bottom:6px} .empty p{max-width:460px;margin:0 auto 20px} .empty.big{padding:72px 20px} .empty-ic{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--leaf-soft);color:var(--green);margin-bottom:14px}
.empty-art{display:flex;justify-content:center;gap:10px;margin-bottom:26px} .empty-art span{width:64px;height:84px;border-radius:5px;background:var(--leaf-soft)} .empty-art span:nth-child(2){background:var(--forest);height:100px;margin-top:-8px} .empty-art span:nth-child(3){background:var(--maroon-soft)}

/* studio shell */
.st{min-height:100vh;display:flex;flex-direction:column}
.st-top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;height:56px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line)}
.st-back{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--r);color:var(--text)} .st-back:hover{background:var(--hover)}
.st-brand{display:flex;align-items:center;gap:9px;min-width:0} .st-brand strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;color:var(--ink)} .st-dot{width:10px;height:10px;border-radius:50%}
.tabs{display:flex;gap:2px;margin-left:12px} .tabs a{padding:7px 12px;border-radius:var(--r);text-decoration:none;color:var(--muted);font-weight:500} .tabs a:hover{background:var(--hover);color:var(--ink)} .tabs a.on{color:var(--forest);background:var(--leaf-soft)}
.st-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.save-status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);white-space:nowrap;margin-right:4px} .save-status i{width:7px;height:7px;border-radius:50%;background:var(--leaf)} .save-status.s-pending i{background:#C9A44C} .save-status.s-saving i{background:#C9A44C;animation:pulse 1s infinite} .save-status.s-error{color:var(--maroon)} .save-status.s-error i{background:var(--maroon)} @keyframes pulse{50%{opacity:.3}}

/* editor */
.ed{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.ed-body{flex:1;display:grid;grid-template-columns:260px 1fr 300px;min-height:0}
.ed-left,.ed-right{background:#fff;overflow:auto;min-height:0} .ed-left{border-right:1px solid var(--line)} .ed-right{border-left:1px solid var(--line)}
.ed-center{background:#EEEBE3;min-width:0;min-height:0;display:flex} .ed-scroll{flex:1;overflow:auto;padding:28px} .ed-canvas{margin:0 auto;background:#fff;box-shadow:0 2px 24px rgba(30,53,16,.12);transition:max-width .3s ease;max-width:1180px;min-height:100%} .ed-canvas.dev-mobile{max-width:390px}
.nav-h{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 8px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav-tree{padding:0 8px 40px}
.nav-item,.nav-cht,.nav-pgt{border:0;background:none;text-align:left;display:flex;align-items:center;gap:8px;width:100%;min-width:0}
.nav-ov{padding:8px 10px;border-radius:var(--r);font-weight:600;color:var(--ink);margin-bottom:6px} .nav-ov:hover{background:var(--hover)} .nav-ov.on{background:var(--leaf-soft);color:var(--forest)}
.nav-ch{margin-bottom:4px}
.nav-chh{display:flex;align-items:center;gap:2px;border-radius:var(--r);padding:2px 2px 2px 0} .nav-chh:hover{background:var(--hover)} .nav-chh.on{background:var(--leaf-soft)} .nav-chh.on .nav-cht{color:var(--forest)}
.nav-tog{border:0;background:none;width:24px;height:28px;display:grid;place-items:center;color:var(--muted);transition:transform .15s;flex-shrink:0} .nav-ch.closed .nav-tog{transform:rotate(-90deg)} .nav-ch.closed .nav-pages{display:none}
.nav-cht{padding:5px 2px;font-weight:600;color:var(--ink);font-size:13.5px} .nav-num{font-size:11px;color:var(--leaf);font-weight:700;font-variant-numeric:tabular-nums} .nav-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-pages{padding-left:18px;border-left:1px solid var(--line);margin-left:13px}
.nav-pg{display:flex;align-items:center;gap:2px;border-radius:var(--r);padding-right:2px;position:relative} .nav-pg:hover{background:var(--hover)} .nav-pg.on{background:var(--leaf-soft)} .nav-pg.on .nav-pgt{color:var(--forest);font-weight:600} .nav-pg.hid .nav-pgt{color:var(--grey)}
.nav-pgt{padding:6px 2px;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .nav-grip{color:var(--line-2);cursor:grab;display:grid;place-items:center;width:14px} .nav-pg:hover .nav-grip{color:var(--grey)} .nav-hid{color:var(--grey);display:grid}
.nav-pg .icon-btn,.nav-chh .icon-btn{opacity:0} .nav-pg:hover .icon-btn,.nav-chh:hover .icon-btn,.nav-pg .icon-btn:focus-visible,.nav-chh .icon-btn:focus-visible{opacity:1}
.nav-add{border:0;background:none;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;padding:6px 4px} .nav-add:hover{color:var(--green)}
.dragging{opacity:.4} .drop-b{box-shadow:inset 0 2px 0 var(--leaf)} .drop-a{box-shadow:inset 0 -2px 0 var(--leaf)} .drop-in{background:var(--leaf-soft)!important;outline:1px dashed var(--leaf)}
/* properties */
.pp-h{display:flex;align-items:flex-start;gap:8px;padding:16px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2} .pp-h h2{font-size:15px} .pp-k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pp-sec{padding:14px 16px;border-bottom:1px solid var(--line)} .pp-sec h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:700} .pp-sec p{margin:6px 0}
.pp-imgprev{border-radius:var(--r);overflow:hidden;background:var(--hover);aspect-ratio:4/3;margin-bottom:6px} .pp-imgprev img{width:100%;height:100%;object-fit:cover}
.pp-lib{display:grid;grid-template-columns:repeat(4,1fr);gap:6px} .pp-lib button{border:1px solid var(--line);border-radius:5px;padding:0;aspect-ratio:1;overflow:hidden;background:var(--hover)} .pp-lib button:hover{border-color:var(--leaf)} .pp-lib img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chip{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.12);padding:0;position:relative} .chip.sq{border-radius:5px} .chip.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--leaf)} .chip.none{background:#fff;display:grid;place-items:center;color:var(--muted)} .chip.custom{background:conic-gradient(#e66,#ec5,#6c6,#5ce,#66e,#e6e,#e66);overflow:hidden;cursor:pointer} .chip.custom input{opacity:0;width:100%;height:100%;cursor:pointer}
.pp-items{display:flex;flex-direction:column;gap:4px;margin-bottom:8px} .pp-item{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;border:1px solid var(--line);border-radius:5px;font-size:12.5px} .pp-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-file{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;font-size:12.5px} .pp-file span{flex:1;overflow:hidden;text-overflow:ellipsis}
.pp-sw{height:80px;border-radius:var(--r);margin-bottom:12px;border:1px solid rgba(0,0,0,.08)}
.trait-r{display:flex;flex-direction:column;font-size:12px;margin-bottom:8px}
.tips ul{margin:0;padding-left:16px;color:var(--muted);font-size:12.5px;line-height:1.9}

/* wizard */
.wz{flex:1;display:grid;grid-template-columns:280px 1fr;min-height:0}
.wz-rail{border-right:1px solid var(--line);background:#fff;padding:28px 18px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;display:flex;flex-direction:column;gap:24px}
.wz-rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px} .wz-rail button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:9px 10px;border-radius:var(--r);text-align:left;color:var(--muted);font-weight:500} .wz-rail button:hover:not(:disabled){background:var(--hover)} .wz-rail button:disabled{opacity:.5;cursor:default}
.wz-n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0} .wz-rail li.on button{color:var(--forest);background:var(--leaf-soft)} .wz-rail li.on .wz-n{border-color:var(--forest);background:var(--forest);color:#fff} .wz-rail li.done .wz-n{border-color:var(--leaf);background:var(--leaf);color:#fff}
.wz-prev{margin-top:auto;border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;background:var(--bb-bg);color:var(--bb-ink)} .wz-prev-logo{height:46px;display:flex;align-items:center;margin-bottom:14px} .wz-prev-logo img{max-height:46px;max-width:100%} .wz-prev-logo .bb-wordmark{font-size:20px} .wz-prev-sw{display:flex;gap:4px;margin-bottom:12px} .wz-prev-sw i{flex:1;height:22px;border-radius:3px} .wz-prev p{margin:0;font-size:20px;line-height:1.1} .wz-prev small{color:var(--bb-muted)}
.wz-main{padding:40px 48px 120px;max-width:980px;width:100%} .wz-head{margin-bottom:12px} .wz-k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf);font-weight:700} .wz-head h1{font-size:30px;letter-spacing:-.02em;color:var(--forest);margin-top:4px}
.wz-foot{position:fixed;bottom:0;left:280px;right:0;display:flex;justify-content:space-between;padding:14px 48px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-top:1px solid var(--line);z-index:20}
.logo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.drop{position:relative;border:1.5px dashed var(--line-2);border-radius:var(--r-lg);background:#fff;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:18px 18px 36px;cursor:pointer;color:var(--muted);transition:border-color .15s,background .15s} .drop:hover,.drop.over{border-color:var(--leaf);background:var(--leaf-tint)} .drop strong{color:var(--ink)} .drop span{font-size:12px}
.drop.has{border-style:solid;cursor:default} .drop.has img{max-width:78%;max-height:62%;object-fit:contain} .drop.dark.has{background:#1f241c} .drop.busy::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.7) url() center no-repeat;border-radius:inherit}
.drop-l{position:absolute;bottom:10px;left:0;right:0;font-size:12px;font-weight:600;color:var(--muted)} .drop.dark.has .drop-l{color:#ccc} .drop-l em{font-style:normal;color:var(--leaf);font-weight:500}
.drop-acts{position:absolute;top:10px;right:10px;display:flex;gap:6px;opacity:0;transition:opacity .15s} .drop:hover .drop-acts,.drop:focus-within .drop-acts{opacity:1} .drop-acts .icon-btn{background:#fff;border-color:var(--line)}
.col-group{margin-bottom:26px} .col-gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px} .col-gh h2{font-size:16px}
.col-list{display:flex;flex-direction:column;gap:8px} .col-row{display:grid;grid-template-columns:44px 1fr 110px 120px auto auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px}
.col-sw{width:44px;height:38px;border-radius:5px;border:1px solid rgba(0,0,0,.1);cursor:pointer;overflow:hidden;position:relative} .col-sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer} .col-rgb{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace}
.suggest{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px;border-radius:var(--r-lg);background:var(--leaf-tint);border:1px solid var(--leaf-soft)} .suggest strong{display:flex;align-items:center;gap:6px;color:var(--forest)} .suggest p{margin:2px 0 0} .suggest-sw{display:flex;gap:10px;margin-left:auto} .suggest-sw span{display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-family:ui-monospace,monospace;color:var(--muted)} .suggest-sw i{width:38px;height:38px;border-radius:5px;border:1px solid rgba(0,0,0,.08)}
.type-grid{display:flex;flex-direction:column;gap:16px} .type-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:18px} .type-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px} .type-h h2{font-size:15px} .type-h p{margin:2px 0 0}
.type-prev{display:flex;align-items:center;gap:22px;padding:18px;border-radius:var(--r);background:var(--ivory);margin-bottom:14px;color:var(--ink);min-height:100px} .type-aa{font-size:64px;line-height:1} .tp-h{font-size:34px;line-height:1.1} .tp-b{font-size:16px;line-height:1.55} .tp-a{font-size:14px;letter-spacing:.1em}
.img-group{margin-bottom:26px} .img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:10px;border-radius:var(--r-lg);border:1.5px dashed transparent;transition:all .15s} .img-grid.over{border-color:var(--leaf);background:var(--leaf-tint)}
.img-th{position:relative;aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:var(--hover)} .img-th img{width:100%;height:100%;object-fit:cover} .img-th .icon-btn{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92);opacity:0} .img-th:hover .icon-btn,.img-th .icon-btn:focus-visible{opacity:1}
.img-add{aspect-ratio:1;border:1.5px dashed var(--line-2);border-radius:var(--r);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12px} .img-add:hover{border-color:var(--leaf);color:var(--green)}
.review{display:grid;grid-template-columns:1fr 1fr;gap:14px} .rv-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;position:relative} .rv-card.wide{grid-column:1/-1} .rv-card h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px} .rv-card .link{position:absolute;top:16px;right:18px;font-size:13px} .rv-card p{margin:0 0 6px} .rv-name{font-size:22px;font-weight:600;color:var(--ink)}
.rv-card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0;font-size:13px} .rv-card dt{color:var(--muted)} .rv-card dd{margin:0}

<script>/* ============ chlorophyll brandbook studio — core utilities, storage, state ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = (p = '') => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const slugify = (s) => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'brand';
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const fmtDate = (t) => { if (!t) return '—'; const d = new Date(t); const diff = (Date.now() - d) / 1000; if (diff < 60) return 'Just now'; if (diff < 3600) return Math.floor(diff / 60) + ' min ago'; if (diff < 86400) return Math.floor(diff / 3600) + ' h ago'; return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); };
const fmtSize = (b) => !b ? '—' : b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const setPath = (o, p, v) => { const ks = p.split('.'); let c = o; ks.slice(0, -1).forEach((k, i) => { if (c[k] == null) c[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; c = c[k]; }); c[ks[ks.length - 1]] = v; };

/* ---- colour maths ---- */
const hexToRgb = (h) => { h = String(h || '').replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); if (isNaN(n) || h.length !== 6) return null; return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 }; };
const rgbToHex = ({ r, g, b }) => '#' + [r, g, b].map((x) => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, '0')).join('').toUpperCase();
const normHex = (h) => { const r = hexToRgb(h); return r ? rgbToHex(r) : null; };
const lum = (h) => { const c = hexToRgb(h) || { r: 0, g: 0, b: 0 }; const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b); };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const onColor = (bg) => (contrast(bg, '#FFFFFF') >= contrast(bg, '#141414') ? '#FFFFFF' : '#141414');
const mix = (a, b, t) => { const x = hexToRgb(a), y = hexToRgb(b); if (!x || !y) return a; return rgbToHex({ r: x.r + (y.r - x.r) * t, g: x.g + (y.g - x.g) * t, b: x.b + (y.b - x.b) * t }); };
const toCmyk = (h) => { const c = hexToRgb(h); if (!c) return ''; const r = c.r / 255, g = c.g / 255, b = c.b / 255; const k = 1 - Math.max(r, g, b); if (k === 1) return '0 0 0 100'; return [(1 - r - k) / (1 - k), (1 - g - k) / (1 - k), (1 - b - k) / (1 - k), k].map((v) => Math.round(v * 100)).join(' '); };
const rgbStr = (h) => { const c = hexToRgb(h); return c ? `${c.r} ${c.g} ${c.b}` : ''; };

/* ---- toasts + dialogs (alert/confirm are blocked in the frame) ---- */
function toast(msg, kind = 'ok') {
  let host = $('#toasts'); if (!host) { host = document.createElement('div'); host.id = 'toasts'; host.setAttribute('role', 'status'); host.setAttribute('aria-live', 'polite'); document.body.appendChild(host); }
  const el = document.createElement('div'); el.className = 'toast toast-' + kind; el.textContent = msg; host.appendChild(el);
  setTimeout(() => el.classList.add('out'), 2600); setTimeout(() => el.remove(), 3000);
}
function modal({ title, body = '', actions = [], wide = false, onMount }) {
  return new Promise((resolve) => {
    const prev = document.activeElement;
    const wrap = document.createElement('div'); wrap.className = 'modal-wrap';
    wrap.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="mdl-t"><div class="modal-h"><h2 id="mdl-t">${esc(title)}</h2><button class="icon-btn" data-x aria-label="Close">${ic('x')}</button></div><div class="modal-b">${body}</div>${actions.length ? `<div class="modal-f">${actions.map((a, i) => `<button class="btn ${a.kind || ''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div>` : ''}</div>`;
    document.body.appendChild(wrap);
    const close = (v) => { wrap.remove(); document.removeEventListener('keydown', onKey, true); prev && prev.focus && prev.focus(); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(null); } if (e.key === 'Tab') { const f = $$('button,input,select,textarea,[tabindex]:not([tabindex="-1"])', wrap).filter((x) => !x.disabled); if (!f.length) return; const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } } };
    document.addEventListener('keydown', onKey, true);
    wrap.addEventListener('mousedown', (e) => { if (e.target === wrap) close(null); });
    $('[data-x]', wrap).onclick = () => close(null);
    $$('[data-i]', wrap).forEach((b) => (b.onclick = () => { const a = actions[+b.dataset.i]; const v = a.value !== undefined ? (typeof a.value === 'function' ? a.value(wrap) : a.value) : true; if (v === false) return; close(v); }));
    onMount && onMount(wrap, close);
    setTimeout(() => { const f = $('input,select,textarea', wrap) || $('.modal-f .btn:last-child', wrap); f && f.focus(); }, 30);
  });
}
const confirmDlg = (title, text, label = 'Delete', kind = 'danger') => modal({ title, body: `<p class="muted">${esc(text)}</p>`, actions: [{ label: 'Cancel', value: null }, { label, kind, value: true }] }).then((v) => v === true);
const promptDlg = (title, value = '', label = 'Save') => modal({ title, body: `<label class="fld"><span>Name</span><input class="inp" id="pd-v" value="${esc(value)}" maxlength="80"></label>`, actions: [{ label: 'Cancel', value: null }, { label, kind: 'primary', value: (w) => { const v = $('#pd-v', w).value.trim(); if (!v) { $('#pd-v', w).classList.add('err'); return false; } return v; } }], onMount: (w, close) => { $('#pd-v', w).addEventListener('keydown', (e) => { if (e.key === 'Enter') { const v = e.target.value.trim(); if (v) close(v); } }); } });

async function copyText(t, msg = 'Copied') { try { await navigator.clipboard.writeText(t); toast(msg); } catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(msg); } catch (_) { toast('Copy not allowed here — ' + t, 'err'); } ta.remove(); } }

const fileToDataURL = (f) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
const dataURLToBlob = async (u) => (await fetch(u)).blob();
function pickFiles(accept, multiple = false) {
  return new Promise((res) => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.multiple = multiple; i.style.display = 'none'; document.body.appendChild(i); i.onchange = () => { res(Array.from(i.files || [])); i.remove(); }; i.click(); setTimeout(() => { if (!i.files || !i.files.length) { /* user may cancel */ } }, 60000); });
}
const ACCEPT = { image: 'image/png,image/jpeg,image/svg+xml,image/webp', logo: 'image/png,image/jpeg,image/svg+xml,image/webp', font: '.ttf,.otf,.woff,.woff2', any: '*/*' };
function fileKind(name = '', type = '') { const e = name.split('.').pop().toLowerCase(); if (/^image\//.test(type) || ['png', 'jpg', 'jpeg', 'svg', 'webp', 'gif'].includes(e)) return 'image'; if (['ttf', 'otf', 'woff', 'woff2'].includes(e)) return 'font'; if (/^video\//.test(type) || ['mp4', 'webm', 'mov'].includes(e)) return 'video'; if (e === 'pdf') return 'pdf'; return 'file'; }
const extOf = (n = '') => (n.includes('.') ? n.split('.').pop().toUpperCase() : 'FILE');

/* ================= Password protection (AES-GCM, key from PBKDF2) ================= */
const b64 = { enc: (buf) => { let s = ''; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }, dec: (str) => Uint8Array.from(atob(str), (c) => c.charCodeAt(0)) };
async function deriveKey(password, salt) { const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 210000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); }
async function encryptJSON(obj, password) { const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)); const key = await deriveKey(password, salt); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))); return { salt: b64.enc(salt), iv: b64.enc(iv), data: b64.enc(ct) }; }
async function decryptJSON(enc, password) { const key = await deriveKey(password, b64.dec(enc.salt)); const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(enc.iv) }, key, b64.dec(enc.data)); return JSON.parse(new TextDecoder().decode(pt)); }

/* ================= Storage clean-up (team edition) ================= */
function filePaths(objs) { const out = new Set(); const re = /brand-assets\/([^"'?#\s\\]+)/g; const txt = JSON.stringify(objs); let m; while ((m = re.exec(txt))) out.add(m[1]); return out; }
const GC = { brandId: null, start: new Set(), uploads: new Set(), extra: new Set(), running: false };
function gcTrack(brand, pages) { GC.brandId = brand?.id || null; GC.start = brand ? filePaths([brand, pages]) : new Set(); GC.uploads = new Set(); GC.extra = new Set(); }
async function gcRun(brand, pages, { quiet = true } = {}) {
  if (Store.mode !== 'supabase' || GC.running) return 0;
  const now = brand ? filePaths([brand, pages]) : new Set();
  const cand = [...GC.start, ...GC.uploads, ...GC.extra].filter((p) => !now.has(p)); if (!cand.length) { GC.start = now; GC.uploads = new Set(); GC.extra = new Set(); return 0; }
  GC.running = true; let n = 0;
  try { n = await SB.removeIfUnused(cand); GC.start = now; GC.uploads = new Set(); GC.extra = new Set(); if (n && !quiet) toast(`Freed ${n} unused file${n === 1 ? '' : 's'} from storage`); } catch (e) { console.warn(e); }
  GC.running = false; return n;
}

/* ================= Storage ================= */
/* Two adapters with one interface:
   - Cloud: the artifact's db (documents) + assets (files), private per user under data/users/<id>/,
     published snapshots under published/<slug>.
   - Local: IndexedDB in this browser (used when the page runs outside claude.ai or signed out). */
const IDB = {
  db: null,
  open() { if (this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { const r = indexedDB.open('brandbook-studio', 1); r.onupgradeneeded = () => { ['kv', 'files'].forEach((s) => r.result.objectStoreNames.contains(s) || r.result.createObjectStore(s)); }; r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  async tx(store, mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction(store, mode); const s = t.objectStore(store); const out = fn(s); t.oncomplete = () => res(typeof IDBRequest !== 'undefined' && out instanceof IDBRequest ? out.result : out); t.onerror = () => rej(t.error); }); },
  get(store, k) { return this.tx(store, 'readonly', (s) => s.get(k)); },
  put(store, k, v) { return this.tx(store, 'readwrite', (s) => s.put(v, k)); },
  del(store, k) { return this.tx(store, 'readwrite', (s) => s.delete(k)); },
  async keys(store) { return this.tx(store, 'readonly', (s) => s.getAllKeys()); },
};

const Store = {
  mode: 'loading', // 'cloud' | 'local' | 'memory'
  db: null, assets: null, user: null, uid: null, downloads: null, profile: null,
  mem: {},
  async init() {
    const use = (n) => (window.claude && window.claude.use ? Promise.race([window.claude.use(n).catch(() => null), new Promise((r) => setTimeout(() => r(null), 6000))]) : Promise.resolve(null));
    if (window.STATIC_BB) { this.mode = 'static'; return this.mode; }
    const cfg = window.SUPABASE_CONFIG;
    if (cfg && cfg.url && cfg.key) { try { await SB.init(cfg); this.mode = 'supabase'; return this.mode; } catch (e) { console.error('Supabase init failed', e); this.sbError = e.message || String(e); } }
    const [db, assets, user, downloads] = await Promise.all([use('db'), use('assets'), use('user'), use('downloads')]);
    this.downloads = downloads;
    let id = null; try { id = user ? await user.id() : null; } catch (e) { }
    if (db && id) {
      this.db = db; this.assets = assets; this.user = user; this.uid = id; this.mode = 'cloud';
      try { const me = await user.me(); this.profile = me; } catch (e) { }
    } else {
      try { await IDB.open(); this.mode = 'local'; } catch (e) { this.mode = 'memory'; }
    }
    return this.mode;
  },
  /* --- paths --- */
  brandsCol() { return this.db.collection('data/users/' + this.uid); },
  brandDoc(id) { return this.brandsCol().doc('b_' + id); },
  pageDoc(bid, pid) { return this.brandDoc(bid).collection('pages').doc(pid); },
  pubDoc(slug) { return this.db.doc('published/' + slug); },
  pubPage(slug, pid) { return this.pubDoc(slug).collection('pages').doc(pid); },
  /* --- generic kv for local --- */
  async kget(k) { if (this.mode === 'local') return IDB.get('kv', k); return this.mem[k]; },
  async kput(k, v) { if (this.mode === 'local') return IDB.put('kv', k, clone(v)); this.mem[k] = clone(v); },
  async kdel(k) { if (this.mode === 'local') return IDB.del('kv', k); delete this.mem[k]; },
  async kkeys(prefix) { const ks = this.mode === 'local' ? await IDB.keys('kv') : Object.keys(this.mem); return ks.filter((k) => String(k).startsWith(prefix)); },

  async retry(fn) { try { return await fn(); } catch (e) { if (e && e.code === 'unavailable') { await new Promise((r) => setTimeout(r, 400 + Math.random() * 600)); return fn(); } throw e; } },

  /* --- brands --- */
  async listBrands() {
    if (this.mode === 'supabase') return SB.listBrands();
    if (this.mode === 'cloud') { const s = await this.retry(() => this.brandsCol().get()); return s.docs.filter((d) => d.id.startsWith('b_')).map((d) => JSON.parse(d.data().json)); }
    const ks = await this.kkeys('brand:'); const out = []; for (const k of ks) out.push(await this.kget(k)); return out.filter(Boolean);
  },
  async getBrand(id) {
    if (this.mode === 'supabase') return SB.getBrand(id);
    if (this.mode === 'cloud') { const s = await this.retry(() => this.brandDoc(id).get()); return s.exists ? JSON.parse(s.data().json) : null; }
    return (await this.kget('brand:' + id)) || null;
  },
  async saveBrand(b) {
    if (this.mode === 'supabase') return SB.saveBrand(b);
    if (this.mode === 'cloud') return this.retry(() => this.brandDoc(b.id).set({ json: JSON.stringify(b), name: b.name, updatedAt: b.updatedAt || Date.now() }));
    return this.kput('brand:' + b.id, b);
  },
  async getPages(bid, ids) {
    if (this.mode === 'supabase') return SB.getPages(bid, ids);
    const out = {};
    if (this.mode === 'cloud') { const s = await this.retry(() => this.brandDoc(bid).collection('pages').get()); s.docs.forEach((d) => (out[d.id] = JSON.parse(d.data().json))); return out; }
    for (const id of ids) { const p = await this.kget('page:' + bid + ':' + id); if (p) out[id] = p; } return out;
  },
  async savePage(bid, p) {
    if (this.mode === 'supabase') return SB.savePage(bid, p);
    if (this.mode === 'cloud') return this.retry(() => this.pageDoc(bid, p.id).set({ json: JSON.stringify(p) }));
    return this.kput('page:' + bid + ':' + p.id, p);
  },
  async deletePage(bid, pid) {
    if (this.mode === 'supabase') return SB.deletePage(bid, pid);
    if (this.mode === 'cloud') return this.retry(() => this.pageDoc(bid, pid).delete());
    return this.kdel('page:' + bid + ':' + pid);
  },
  async deleteBrand(b) {
    if (this.mode === 'supabase') return SB.deleteBrand(b);
    const ids = allPageIds(b);
    if (this.mode === 'cloud') { for (const pid of ids) await this.pageDoc(b.id, pid).delete().catch(() => { }); await this.brandDoc(b.id).delete(); }
    else { for (const pid of ids) await this.kdel('page:' + b.id + ':' + pid); await this.kdel('brand:' + b.id); }
  },
  /* --- published --- */
  async getPublished(slug) {
    if (this.mode === 'supabase') return SB.getPublished(slug);
    if (this.mode === 'static') { const S0 = window.STATIC_BB; return S0 && (!slug || S0.slug === slug) ? S0 : null; }
    if (this.mode === 'cloud') {
      const s = await this.retry(() => this.pubDoc(slug).get()); if (!s.exists) return null; const d = s.data();
      const ps = await this.pubDoc(slug).collection('pages').get();
      if (d.access === 'password') { const chunks = ps.docs.filter((x) => x.id.startsWith('enc')).sort((a, b) => +a.id.slice(3) - +b.id.slice(3)).map((x) => x.data().c).join(''); return { ...d, enc: { salt: d.salt, iv: d.iv, data: chunks } }; }
      const brand = JSON.parse(d.json); const pages = {}; ps.docs.forEach((x) => (pages[x.id] = JSON.parse(x.data().json))); return { ...d, brand, pages };
    }
    const d = await this.kget('pub:' + slug); return d || null;
  },
  async slugOwner(slug) {
    if (this.mode === 'supabase') return SB.slugOwner(slug);
    if (this.mode === 'cloud') { const s = await this.pubDoc(slug).get(); return s.exists ? s.data().brandId : null; }
    const d = await this.kget('pub:' + slug); return d ? d.brandId : null;
  },
  async publish(slug, brand, pages, prevSlug, access = { mode: 'public' }) {
    const prot = access.mode === 'password';
    const meta = { slug, brandId: brand.id, owner: this.uid || 'local', publishedAt: Date.now(), access: prot ? 'password' : 'public', title: prot ? 'Protected brandbook' : brand.seo?.title || brand.name, description: prot ? '' : brand.seo?.description || brand.info?.description || '' };
    const pubBrand = clone(brand); if (pubBrand.pub) delete pubBrand.pub.pw;
    const enc = prot ? await encryptJSON({ brand: pubBrand, pages }, access.password) : null;
    if (this.mode === 'supabase') { await SB.publish(slug, brand.id, meta, prot ? null : pubBrand, prot ? null : pages, enc, prevSlug); return meta; }
    if (this.mode === 'cloud') {
      if (prevSlug && prevSlug !== slug) await this.unpublish(prevSlug).catch(() => { });
      const existing = await this.pubDoc(slug).collection('pages').get().catch(() => null);
      const keep = new Set();
      if (prot) { const CH = 180000; for (let i = 0, n = 0; i < enc.data.length; i += CH, n++) { keep.add('enc' + n); const c = enc.data.slice(i, i + CH); await this.retry(() => this.pubPage(slug, 'enc' + n).set({ c })); } }
      else for (const pid of Object.keys(pages)) { keep.add(pid); await this.retry(() => this.pubPage(slug, pid).set({ json: JSON.stringify(pages[pid]) })); }
      if (existing) for (const d of existing.docs) if (!keep.has(d.id)) await this.pubPage(slug, d.id).delete().catch(() => { });
      await this.retry(() => this.pubDoc(slug).set(prot ? { ...meta, salt: enc.salt, iv: enc.iv } : { ...meta, json: JSON.stringify(pubBrand) }));
    } else {
      if (prevSlug && prevSlug !== slug) await this.kdel('pub:' + prevSlug);
      await this.kput('pub:' + slug, prot ? { ...meta, enc } : { ...meta, brand: pubBrand, pages });
    }
    return meta;
  },
  async unpublish(slug) {
    if (this.mode === 'supabase') return SB.unpublish(slug);
    if (this.mode === 'cloud') { const ps = await this.pubDoc(slug).collection('pages').get().catch(() => null); if (ps) for (const d of ps.docs) await this.pubPage(slug, d.id).delete().catch(() => { }); await this.pubDoc(slug).delete(); }
    else await this.kdel('pub:' + slug);
  },
  /* --- files --- */
  async upload(file, name) {
    name = name || file.name || 'file';
    const kind = fileKind(name, file.type);
    if (this.mode === 'supabase') return SB.upload(file, name, kind);
    if (this.mode === 'cloud' && this.assets) {
      const r = await this.assets.upload(file);
      return { id: r.id, url: r.url || '/_blob/' + r.id, name, type: file.type || r.contentType, size: r.sizeBytes || file.size, kind };
    }
    const id = uid('f_'); const url = await fileToDataURL(file);
    if (this.mode === 'local') await IDB.put('files', id, url);
    return { id, url, name, type: file.type, size: file.size, kind };
  },
  async removeFile(ref) { if (this.mode === 'supabase') return SB.removeFile(ref); try { if (this.mode === 'cloud' && this.assets && ref?.id) await this.assets.delete(ref.id); else if (this.mode === 'local' && ref?.id) await IDB.del('files', ref.id); } catch (e) { } },
  async save(filename, data) {
    if (this.downloads) { try { await this.downloads.save({ filename, data }); toast('Saved ' + filename); return true; } catch (e) { if (e && e.code === 'declined') return false; toast('Download unavailable: ' + (e.message || e.code), 'err'); return false; } }
    try { const blob = data instanceof Blob ? data : new Blob([data]); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return true; } catch (e) { toast('Downloads are blocked in this view', 'err'); return false; }
  },
};
function allPageIds(b) { return (b.chapters || []).flatMap((c) => c.pages.map((p) => p.id)); }

function loadScript(src) { return new Promise((res, rej) => { if ($$('script').some((s) => s.src === src)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); }); }

document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (Site.state && (document.body.classList.contains('is-site') || $('#pv-site')) && ((mod && e.key.toLowerCase() === 'k') || (e.key === '/' && !e.target.closest('input,textarea,[contenteditable="true"]')))) { e.preventDefault(); Site.openSearch(); return; }
  if (!$('.ed')) return;
  const inText = e.target.closest('input,textarea,select,[contenteditable="true"]');
  if (mod && e.key.toLowerCase() === 'z' && !inText) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if (mod && e.key.toLowerCase() === 'y' && !inText) { e.preventDefault(); redo(); }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); flushSave(); }
  if (e.key === 'Escape' && !inText && !$('.modal-wrap') && Ed.sel) select(null);
});

function authShell(inner) { return `<main class="gate auth"><div class="gate-box"><div class="auth-brand"><img src="${window.LEAF || ''}" alt=""><span><b>chlorophyll</b> brandbook studio</span></div>${inner}</div></main>`; }
function renderLogin(mode = 'in', note = '') {
  document.title = 'Sign in — chlorophyll brandbook studio';
  $('#app').innerHTML = authShell(`<div class="seg full auth-tabs" role="tablist"><button class="${mode === 'in' ? 'on' : ''}" data-am="in" role="tab">Sign in</button><button class="${mode === 'up' ? 'on' : ''}" data-am="up" role="tab">Create account</button></div>

    ${note ? `<p class="auth-note">${note}</p>` : ''}
    <form id="auth-f" novalidate><label class="fld"><span>Email</span><input class="inp" id="au-e" type="email" autocomplete="email" required></label>${mode !== 'reset' ? `<label class="fld"><span>Password</span><input class="inp" id="au-p" type="password" autocomplete="${mode === 'up' ? 'new-password' : 'current-password'}" minlength="8" required>${mode === 'up' ? '<small class="muted">At least 8 characters.</small>' : ''}</label>` : ''}<p class="err-t" id="au-err" role="alert"></p><button class="btn primary lg" type="submit">${mode === 'up' ? 'Create account' : mode === 'reset' ? 'Send reset link' : 'Sign in'}</button></form>

  $$('[data-am]').forEach((b) => (b.onclick = () => renderLogin(b.dataset.am)));
  $('#au-e').focus();
  $('#auth-f').onsubmit = async (e) => {
    e.preventDefault(); const em = $('#au-e').value.trim(); const pw = $('#au-p')?.value || ''; const err = $('#au-err');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { err.textContent = 'Enter a valid email address.'; return; }

    const btn = $('#auth-f button'); btn.disabled = true; const lbl = btn.textContent; btn.innerHTML = '<span class="spin"></span>';
    try {
      if (mode === 'in') { const { error } = await SB.signIn(em, pw); if (error) throw error; }
      else if (mode === 'up') { const { data, error } = await SB.signUp(em, pw); if (error) throw error; if (!data.session) return renderLogin('in', `Check <strong>${esc(em)}</strong> for a confirmation link, then sign in.`); }

  };
}

const isImgFile = (f) => /^image\//.test(f.type) || /\.(svg|png|jpe?g|webp|gif)$/i.test(f.name || '');
const labelFrom = (n) => { const s = String(n || '').replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').trim(); return s ? s[0].toUpperCase() + s.slice(1) : 'Untitled'; };
async function uploadPicked(files, { images = false, max = 20 } = {}) {
  const out = [];
  for (const f of files) {
    if (images && !isImgFile(f)) { toast(`${f.name}: please use PNG, JPG, SVG or WebP`, 'err'); continue; }
    if (f.size > max * 1048576) { toast(`${f.name} is larger than ${max} MB`, 'err'); continue; }
    try { const r = await Store.upload(f); out.push({ id: r.id, url: r.url, name: r.name, type: r.type, size: r.size, uploadedAt: Date.now() }); } catch (e) { toast(`${f.name}: upload failed (${e.message || e.code})`, 'err'); }
  }

}
